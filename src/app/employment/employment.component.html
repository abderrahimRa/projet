<app-sidebar></app-sidebar>
<main>
  <div class="logout-container">
    <button class="logout-button" (click)="onLogout()">
      Log out
    </button>
  </div>
  <h2 id="title">Employment</h2>
      <h3>click on the cell you want to modify</h3>
      <div class="button-container">
        <button (click)="toggleTable()" class="tabButton">
          summary status of the State
          <ion-icon class="rot" name="chevron-down"></ion-icon>
        </button>
        <button id="exportExcel" (click)="saveTableData()">
          <ion-icon name="save"></ion-icon>
        </button>
        <button id="exportExcel" (click)="exportTableToExcel()">
          <img src="logo.png" class="im" />
        </button>
        <button id="exportExcel">
          <label>
            <input type="file" (change)="importFromExcel($event)" accept=".xlsx,.xls" hidden>
            <ion-icon name="document-attach"></ion-icon> Import
          </label>
        </button>
      </div>
<table id="PopulationTable" [ngClass]="{ 'hidden': isTableHidden }">
    <tr>
      <th rowspan="2">Code</th>
      <th rowspan="2">State</th>
      <th colspan="3" title="Indecator">Population</th>
      <th rowspan="2" title="V04">Unemployment rate</th>
    </tr>
    <tr>
      <th >Active</th>
      <th >employed</th>
      <th >Unemployed</th>
    </tr>
  
    <tr *ngFor="let row of tableData; let i = index">
      <td contenteditable="true" (input)="updateCell(i, 'code', $event)">{{ row.code }}</td>
      <td contenteditable="true" (input)="updateCell(i, 'state', $event)">{{ row.state }}</td>
      <td contenteditable="true" (input)="updateCell(i, 'active', $event)">{{ row.active }}</td>
      <td contenteditable="true" (input)="updateCell(i, 'occupied', $event)">{{ row.occupied }}</td>
      <td contenteditable="true" (input)="updateCell(i, 'unemployed', $event)">{{ row.unemployed }}</td>
      <td>{{ row.unemploymentRate }}%</td>
    </tr>
  </table>
  <div class="chart-container">
    <h3>Employment Statistics</h3>
    <canvas id="employmentChart"></canvas>
  </div>
</main>
