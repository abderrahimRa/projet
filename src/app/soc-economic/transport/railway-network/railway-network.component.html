<app-sidebar></app-sidebar>
<main>
  <div class="logout-container">
    <button class="logout-button" (click)="onLogout()">
      Log out
    </button>
  </div>
  <h2 id="title">Railway Network</h2>
      <h3>click on the cell you want to modify</h3>
      <div class="button-container">
        <button (click)="toggleTable()" class="tabButton">
          summary status of the State
          <ion-icon class="rot" name="chevron-down"></ion-icon>
        </button>
        <button id="exportExcel"   (click)="saveTableData()">
          <ion-icon name="save"></ion-icon>
        </button>
        <button id="exportExcel" (click)="exportTableToExcel()">
          <img src="logo.png" class="im" />
        </button>
      </div>
<table id="PopulationTable" [ngClass]="{ 'hidden': isTableHidden }">
  <tr>
    <th rowspan="2">Code</th>
    <th rowspan="2">State</th>
    <th colspan="3">Railway network</th>
  </tr>
  <tr>
    <th>Total track length (km)</th>
    <th>Number of stations</th>
    <th>Number of passengers per year</th>
  </tr>
  <tr *ngFor="let row of tableData; let i = index">
    <td contenteditable="true" (input)="updateCell(i, 'code', $event)">{{row.code}}</td>
    <td contenteditable="true" (input)="updateCell(i, 'state', $event)">{{row.state}}</td>
    <td contenteditable="true" (input)="updateCell(i, 'totalTrackLength', $event)">{{row.totalTrackLength}}</td>
    <td contenteditable="true" (input)="updateCell(i, 'numStations', $event)">{{row.numStations}}</td>
    <td contenteditable="true" (input)="updateCell(i, 'numPassengers', $event)">{{row.numPassengers}}</td>
  </tr>
  </table>
</main>
