<app-sidebar></app-sidebar>
<main>
  <div class="logout-container">
    <button class="logout-button" (click)="onLogout()">
      Log out
    </button>
  </div>
  <h2 id="title">Paramedics</h2>
      <h3>click on the cell you want to modify</h3>
  

      <div class="button-container">
        <button (click)="toggleTable()" class="tabButton">
          summary status of the State
          <ion-icon class="rot" name="chevron-down"></ion-icon>
        </button>
        <button id="exportExcel"   (click)="saveTableData()">
          <ion-icon name="save"></ion-icon>
        </button>
        <button id="exportExcel" (click)="exportTableToExcel()">
          <img src="logo.png" class="im" />
        </button> 
      </div>  
  <table id="PopulationTable" class="tab" [ngClass]="{ 'hidden': isTableHidden }">
    <tr>
      <th rowspan="2">Code</th>
      <th rowspan="2">State</th>
      <th colspan="6">paramedical institutes and schools</th>
    </tr>
    <tr>
      <th>Number of institutes and schools</th>
      <th>Educational capacity</th>
    </tr> 
    
    <tr *ngFor="let row of tableData; let i = index">
      <td contenteditable="true" (input)="updateCell(i, 'code', $event)">{{row.code}}</td>
      <td contenteditable="true" (input)="updateCell(i, 'state', $event)">{{row.state}}</td>
      <td contenteditable="true" (input)="updateCell(i, 'numInstitutesSchools', $event)">{{row.numInstitutesSchools}}</td>
      <td contenteditable="true" (input)="updateCell(i, 'educationalCapacity', $event)">{{row.educationalCapacity}}</td>
    </tr>
  </table>
  <div class="charts-container">
    <div class="chart-wrapper">
      <canvas id="institutesChart"></canvas>
    </div>
    <div class="chart-wrapper">
      <canvas id="capacityChart"></canvas>
    </div>
    <div class="chart-wrapper">
      <canvas id="distributionChart"></canvas>
    </div>
  </div>
 </main>
