<app-sidebar></app-sidebar>
<div class="logout-container">
  <button class="logout-button" (click)="onLogout()">Log out</button>
</div>

<div class="admin-dashboard">
  <h2>Admin Dashboard</h2>

  <div class="stats-card">
    <h3>Active Users</h3>
    <div class="count">{{ activeUserCount }}</div>
    <button (click)="refreshStats()">Refresh</button>
  </div>

  <div class="user-list" *ngIf="activeUsers.length">
    <h3>Currently Active:</h3>
    <ul>
      <li *ngFor="let user of activeUsers">{{ user }}</li>
    </ul>
  </div>

  <!-- User Management Section -->
  <div class="user-management">
    <h3>User Management</h3>

    <!-- Add User Form -->
    <div class="form-card">
      <h4>Add New User</h4>
      <form (ngSubmit)="addUser()" #addUserForm="ngForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="newUser.username"
            required
            placeholder="Enter username"
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="newUser.password"
            required
            placeholder="Enter password"
          />
        </div>
        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" name="role" [(ngModel)]="newUser.role" required>
            <option value="">Select role</option>
            <option value="admin">Admin</option>
            <option value="editor">Editor</option>
            <option value="viewer">Viewer</option>
          </select>
        </div>
        <button type="submit" [disabled]="!addUserForm.valid">Add User</button>
      </form>
    </div>

    <!-- Remove User Form -->
    <div class="form-card">
      <h4>Remove User</h4>
      <form (ngSubmit)="removeUser()" #removeUserForm="ngForm">
        <div class="form-group">
          <label for="userToRemove">Select User</label>
          <select
            id="userToRemove"
            name="userToRemove"
            [(ngModel)]="selectedUserToRemove"
            required
          >
            <option value="">Select user to remove</option>
            <option *ngFor="let user of allUsers" [value]="user.username">
              {{ user.username }} ({{ user.role }})
            </option>
          </select>
        </div>
        <button type="submit" [disabled]="!removeUserForm.valid" class="danger">
          Remove User
        </button>
      </form>
    </div>
  </div>
</div>

<h1>Data Tables</h1>

<!-- Dataset Selection -->
<div class="dataset-selector">
  <label for="datasetSelect">Select Dataset:</label>
  <select
    id="datasetSelect"
    [(ngModel)]="selectedDataset"
    (change)="loadSelectedDataset()"
  >
    <option value="population">Population</option>
    <option value="agriculture">Agriculture</option>
    <option value="health">Health</option>
    <option value="education">Education</option>
    <option value="transport">Transport</option>
    <option value="energy">Energy</option>
    <option value="water">Water</option>
    <option value="employment">Employment</option>
    <option value="tourism">Tourism</option>
    <option value="craftsmanship">Craftsmanship</option>
    <option value="socialProtection">Social Protection</option>
    <option value="youth">Youth</option>
    <option value="sports">Sports</option>
    <option value="worship">Worship</option>
  </select>
</div>

<!-- Dynamic Table -->
<table id="DataTable" class="tab" *ngIf="datasetItems.length > 0">
  <thead>
    <tr>
      <th>Code</th>
      <th>State</th>
      <ng-container *ngFor="let key of displayedColumns">
        <th
          *ngIf="
            key !== 'id' &&
            key !== 'code' &&
            key !== 'state' &&
            key !== 'state_id'
          "
        >
          {{ key }}
        </th>
      </ng-container>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let item of datasetItems">
      <td>{{ item.code }}</td>
      <td>{{ item.state }}</td>
      <ng-container *ngFor="let key of displayedColumns">
        <td
          *ngIf="
            key !== 'id' &&
            key !== 'code' &&
            key !== 'state' &&
            key !== 'state_id'
          "
        >
          {{ item[key] }}
        </td>
      </ng-container>
      <td>
        <button class="edit-btn" (click)="editItem(item)">Edit</button>
        <button class="delete-btn" (click)="deleteItem(item)">Delete</button>
      </td>
    </tr>
  </tbody>
</table>

<div *ngIf="datasetItems.length === 0 && selectedDataset" class="empty-message">
  No data found for selected dataset. Click the button below to add data.
</div>

<button *ngIf="selectedDataset" class="add-btn" (click)="addNewItem()">
  Add New Record
</button>
